<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытка</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <div class="flowers">🧡🎈🎀</div>
        <h1>Любимой маме!</h1>
        <p> Для самого доброго, нежного и догого человека</p>

        <div class="divider">

        </div>
        <button id="openButton">Открыть поздравление🎀</button>

        <div class="messege" id="message">
            <h2>С днем матери</h2>
            <p>
                Пусть каждый день приносит улыбки и цветы, <br>
                Желаю, чтобы сбылись заветные мечты. <br>
                Здоровья и успехов от всей души желаю,<br>
                И с Днём матери тебя сердечно поздравляю. <br>
            </p>
        </div>
    </div>
    <div class="hearts">
        <span style="left: 5%; animation-delay: 0s">❤️</span>
        <span style="left: 15%; animation-delay: 1s">💕</span>
        <span style="left: 25%; animation-delay: 2s">💗</span>
        <span style="left: 35%; animation-delay: 3s">💖</span>
        <span style="left: 45%; animation-delay: 0.5s">❤️</span>
        <span style="left: 55%; animation-delay: 1.5s">💗</span>
        <span style="left: 65%; animation-delay: 2.5s">💕</span>
        <span style="left: 75%; animation-delay: 3.5s">💖</span>
        <span style="left: 85%; animation-delay: 4s">❤️</span>
        <span style="left: 95%; animation-delay: 5s">💗</span>
    </div>
    <script>
        const button = document.getElementById("openButton");
        const message = document.getElementById("message");

        button.addEventListener("click", function () {
            if (message.style.display === "block") {
                message.style.display = "none";
                button.textContent = "Открыть поздравление 💌";
            } else {
                message.style.display = "block";
                button.textContent = "Закрыть открытку";
            }
        });
    </script>
</body>

</html>
